<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VLAD AI TERMINAL</title>
<script src="https://telegram.org"></script>
<script src="https://unpkg.com"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: #131722;
    --border: #1e222d;
    --green: #00e676;
    --gold: #ffb300;
    --red: #ff1744;
    --text: #e0e6ed;
    --muted: #787b86;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 14px; max-width: 480px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .brand { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 6px; }
  .brand span { color: var(--gold); }
  .badge { background: rgba(0, 230, 118, 0.12); color: var(--green); border: 1px solid rgba(0, 230, 118, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .balance-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 3px; }
  .balance { font-size: 30px; font-weight: 800; }
  .pnl { font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
  .pnl.pos { color: var(--green); background: rgba(0, 230, 118, 0.12); }
  .pnl.neg { color: var(--red); background: rgba(255, 23, 68, 0.12); }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .stat-item div:last-child { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .tab { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 7px 6px; border-radius: 9px; font-weight: 700; font-size: 12px; cursor: pointer; text-align: center; }
  .tab.active { background: rgba(255, 179, 0, 0.15); border-color: var(--gold); color: var(--gold); }
  #chart_container { height: 220px; width: 100%; border-radius: 10px; overflow: hidden; }
  .trade-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .trade-item:last-child { border-bottom: none; padding-bottom: 0; }
  .tag-long { color: var(--green); font-weight: 700; }
  .tag-short { color: var(--red); font-weight: 700; }
  .btn-refresh { width: 100%; background: linear-gradient(135deg, #00e676, #00b0ff); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">⚡ VLAD <span>AI TERMINAL</span></div>
    <div class="badge" id="api_badge"><div class="dot"></div> <span id="api_text">LIVE BINGX</span></div>
  </div>

  <div class="card">
    <div class="balance-row">
      <div>
        <div class="label">Баланс разгона</div>
        <div class="balance" id="bal">$100.00</div>
      </div>
      <div class="pnl pos" id="roi">0.0%</div>
    </div>
    <div class="stats-grid">
      <div class="stat-item"><div class="label">Винрейт</div><div id="winrate">0%</div></div>
      <div class="stat-item"><div class="label">Сделок</div><div id="total_trades">0</div></div>
      <div class="stat-item"><div class="label">Риск / Сд.</div><div id="risk_val">$5.0</div></div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="selectAsset('GOLD', this)">GOLD</div>
      <div class="tab" onclick="selectAsset('BTC', this)">BTC</div>
      <div class="tab" onclick="selectAsset('ETH', this)">ETH</div>
      <div class="tab" onclick="selectAsset('SOL', this)">SOL</div>
      <div class="tab" onclick="selectAsset('XRP', this)">XRP</div>
      <div class="tab" onclick="selectAsset('SUI', this)">SUI</div>
    </div>
    <div id="chart_container"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom: 6px;">Активные позиции алгоритма</div>
    <div id="active_list"><div style="color: var(--muted); font-size: 12px;">Сканер ищет точку входа...</div></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom: 6px;">История закрытых сделок</div>
    <div id="history_list"><div style="color: var(--muted); font-size: 12px;">Загрузка истории...</div></div>
  </div>

  <button class="btn-refresh" onclick="loadData()">🔄 ОБНОВИТЬ ДАННЫЕ ТЕРМИНАЛА</button>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand();
    window.Telegram.WebApp.setHeaderColor('#0b0e14');
  }

  let currentAsset = 'GOLD';
  const chartEl = document.getElementById('chart_container');
  const chart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: '#131722' }, textColor: '#787b86' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    timeScale: { timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: '#1e222d' },
  });
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#00e676', downColor: '#ff1744', borderVisible: false,
    wickUpColor: '#00e676', wickDownColor: '#ff1744'
  });

  async function loadChart(asset) {
    try {
      const res = await fetch(`/api/candles?asset=${asset}`);
      const data = await res.json();
      if (data.candles && data.candles.length) {
        candleSeries.setData(data.candles);
        chart.timeScale().fitContent();
      }
    } catch (e) { console.error(e); }
  }

  function selectAsset(asset, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentAsset = asset;
    loadChart(asset);
  }

  async function loadData() {
    try {
      const res = await fetch('/api/state');
      const st = await res.json();
      document.getElementById('bal').innerText = `$${st.balance}`;
      const roiEl = document.getElementById('roi');
      roiEl.innerText = `${st.roi >= 0 ? '+' : ''}${st.roi}% ($${st.net_pnl})`;
      roiEl.className = 'pnl ' + (st.net_pnl >= 0 ? 'pos' : 'neg');
      document.getElementById('winrate').innerText = `${st.winrate}%`;
      document.getElementById('total_trades').innerText = `${st.total} (${st.wins}W/${st.losses}L)`;
      document.getElementById('risk_val').innerText = `$${st.risk} (10x)`;
      document.getElementById('api_text').innerText = st.auto_trade ? 'AUTO-TRADE ON' : 'SIGNALS ONLY';

      const actEl = document.getElementById('active_list');
      if (st.active.length === 0) {
        actEl.innerHTML = '<div style="color: var(--muted); font-size: 12px;">Нет открытых сделок — сканер в поиске</div>';
      } else {
        actEl.innerHTML = st.active.map(t => `
          <div class="trade-item">
            <div><b>${t.asset}</b> <span class="${t.dir === 'LONG' ? 'tag-long' : 'tag-short'}">${t.dir}</span>
            <div style="font-size: 11px; color: var(--muted);">Вход: ${t.entry} • SL: ${t.sl}</div></div>
            <div style="color: var(--gold); font-weight: 700;">TP2: ${t.tp2}</div>
          </div>`).join('');
      }

      const histEl = document.getElementById('history_list');
      if (st.history.length === 0) {
        histEl.innerHTML = '<div style="color: var(--muted); font-size: 12px;">Сделок пока нет</div>';
      } else {
        histEl.innerHTML = st.history.slice().reverse().slice(0, 6).map(t => `
          <div class="trade-item">
            <div><b>${t.asset}</b> <span class="${t.dir === 'LONG' ? 'tag-long' : 'tag-short'}">${t.dir}</span>
            <div style="font-size: 11px; color: var(--muted);">${t.date}</div></div>
            <div style="color: ${t.pnl >= 0 ? 'var(--green)' : 'var(--red)'}; font-weight: 700;">${t.pnl >= 0 ? '+' : ''}$${t.pnl}</div>
          </div>`).join('');
      }
    } catch (e) { console.error(e); }
    loadChart(currentAsset);
  }

  loadData();
  setInterval(loadData, 15000);
</script>
</body>
</html>
